<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bazo Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 1.5rem; }
    h1 { color: #38bdf8; }
    input { width: 100%; max-width: 400px; padding: 0.5rem; margin: 0.5rem 0 1rem; border-radius: 8px; border: none; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin: 1rem 0; }
    .kpi { background: #1e293b; padding: 1rem; border-radius: 12px; }
    .kpi span { font-size: 0.75rem; opacity: 0.8; }
    .kpi strong { font-size: 1.6rem; display: block; color: #fff; margin-top: 0.25rem; }
    .beta-bar, .quota-bar { background: #1e293b; border-radius: 12px; padding: 1rem; margin: 1rem 0; }
    progress { width: 100%; height: 10px; }
    pre { background: #1e293b; padding: 1rem; border-radius: 12px; overflow: auto; font-size: 0.8rem; }
    button { background: #0055a4; color: #fff; border: none; padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; margin-right: 0.5rem; }
    .warn { color: #fbbf24; font-size: 0.85rem; }
    .err { color: #f87171; font-size: 0.9rem; margin: 0.5rem 0; }
    .ok { color: #4ade80; }
    #status { min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>🛠 Bazo Admin</h1>
  <p class="warn">Clé admin = variable <code>BAZO_ADMIN_API_KEY</code> dans <code>.env</code></p>
  <label>Clé admin<input id="admin-key" type="password" autocomplete="off" placeholder="Coller la clé depuis .env" /></label>
  <button id="refresh">Actualiser</button>
  <p id="status" class="err"></p>
  <div class="grid" id="kpis"></div>
  <div class="beta-bar" id="beta-bar"></div>
  <div class="quota-bar" id="quota-bar"></div>
  <h2>Infra</h2>
  <pre id="infra"></pre>
  <details><summary>Régions TER (13)</summary><pre id="regions"></pre></details>
  <script>
    const LS = "bazo_admin_key";
    const inp = document.getElementById("admin-key");
    const status = document.getElementById("status");
    inp.value = sessionStorage.getItem(LS) || "";

    function setStatus(msg, ok) {
      status.textContent = msg || "";
      status.className = ok ? "ok" : "err";
    }

    async function load() {
      const key = inp.value.trim();
      if (!key) { setStatus("Clé admin requise (BAZO_ADMIN_API_KEY dans .env)"); return; }
      sessionStorage.setItem(LS, key);
      setStatus("Chargement…", true);
      const hdr = { "X-Admin-Key": key };
      let r;
      try {
        r = await fetch("/v1/admin/stats", { headers: hdr });
      } catch (e) {
        setStatus("API injoignable — vérifie que bazo-api tourne sur :8080");
        return;
      }
      if (r.status === 403) {
        setStatus("Clé admin invalide — copie BAZO_ADMIN_API_KEY depuis .env");
        return;
      }
      if (!r.ok) {
        setStatus("Erreur API " + r.status + " — " + (await r.text()).slice(0, 120));
        return;
      }
      setStatus("OK", true);
      const d = await r.json();
      const b = d.beta || {};
      const q = d.quota_sncf || {};
      document.getElementById("kpis").innerHTML = [
        ["Inscrits", d.inscrits],
        ["+7j inscrits", b.inscrits_7j ?? 0],
        ["Actifs 7j", b.actifs_7j ?? 0],
        ["Check-in jour", d.checkin_jour],
        ["GF éligibles", d.eligible_gf],
        ["Devices FCM", d.devices_enregistres ?? 0],
      ].map(([l, v]) => `<div class="kpi"><span>${l}</span><strong>${v}</strong></div>`).join("");
      const pct = b.progression_pct ?? 0;
      document.getElementById("beta-bar").innerHTML =
        `<strong>Beta Metz–Lux</strong> ${b.inscrits}/${b.objectif} (${pct}%)` +
        `<progress max="${b.objectif || 25}" value="${b.inscrits || 0}"></progress>` +
        `<p class="${b.atteint ? 'ok' : 'warn'}">${b.atteint ? '✅ Objectif 20+ atteint' : '⏳ Recrutement en cours'}</p>`;
      const qpct = q.budget_jour ? Math.round((q.utilise || 0) * 100 / q.budget_jour) : 0;
      document.getElementById("quota-bar").innerHTML =
        `<strong>Quota API SNCF (jour)</strong> ${q.utilise ?? 0}/${q.budget_jour ?? "?"} (${qpct}%)` +
        `<progress max="${q.budget_jour || 4500}" value="${q.utilise || 0}"></progress>` +
        `<p class="${qpct > 90 ? 'warn' : 'ok'}">Réserve check-in : ${q.reserve_checkin ?? 400} req · scan ${d.infra?.radar_scan_sec ?? 720}s</p>`;
      document.getElementById("infra").textContent = JSON.stringify(d.infra, null, 2);
      const rg = await fetch("/v1/geo/summary");
      if (rg.ok) {
        const g = await rg.json();
        document.getElementById("regions").textContent = JSON.stringify(g.regions, null, 2);
      }
      const h = await fetch("/health");
      if (h.ok) {
        const hv = await h.json();
        document.querySelector("h1").textContent = `🛠 Bazo Admin · API ${hv.version}`;
      }
    }
    document.getElementById("refresh").onclick = load;
    if (inp.value) load();
  </script>
</body>
</html>
